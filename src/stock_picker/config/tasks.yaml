find_trending_sectors:
  description: >
    Search the latest news for {current_date} and find the top 3 trending 
    market sectors that have at least 75% probability of high growth 
    potential over the next 2-3 years.
    For each trending company, use the Web Search Tool to search for the 
    latest news, financials, and analyst opinions. Search for each company 
    individually. Compile a detailed research report from your findings.
  expected_output: >
    A list of 3 trending sectors with a brief rationale for why each 
    sector is trending and its growth potential.
  output_file: output/trending_sectors.json

find_trending_companies:
  description: >
    Search the latest news for {current_date} and find the top 3 trending 
    companies that have at least 75% probability of high growth potential 
    over the next 2-3 years. Use the trending sectors already identified 
    as context to guide your search.
    For each trending company, use the Web Search Tool to search for the 
    latest news, financials, and analyst opinions. Search for each company 
    individually. Compile a detailed research report from your findings.
  expected_output: >
    A list of 3 trending companies with ticker symbols and a brief 
    rationale for why each company is trending and its growth potential.
  context:
    - find_trending_sectors
  output_file: output/trending_companies.json

research_trending_companies:
  description: >
    For each of the trending companies identified, search online and 
    provide a detailed analysis covering market position, competitive 
    landscape, financials, and future growth outlook.
    For each trending company, use the Web Search Tool to search for the 
    latest news, financials, and analyst opinions. Search for each company 
    individually. Compile a detailed research report from your findings.
  expected_output: >
    A detailed research report for each company covering market position,
    competitive analysis, financials, and investment potential.
  context:
    - find_trending_companies
  output_file: output/research_report.json

pick_best_company:
  description: >
    Analyze the research reports and pick the top 3 best companies for 
    investment. Send ONE push notification with the final pick and a 
    1-sentence rationale. Do NOT call the push tool more than once.
    Do NOT send notifications for runner-up companies.
  expected_output: >
    The chosen company and rationale for selection; the runner-up companies 
    and why they were not selected. A detailed investment report.
  context:
    - research_trending_companies
  output_file: output/decision.md